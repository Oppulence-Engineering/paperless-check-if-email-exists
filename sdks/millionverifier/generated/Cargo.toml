[package]
publish = false
name = "millionverifier-sdk"
version = "0.1.0"
authors = ["OpenAPI Generator team and contributors"]
description = "API stands for Application Programming Interface. You can connect our system with your website, landing page, application or software to verify emails in real time or to send us files programmatically.  Using MillionVerifier's API you can avoid bad emails added to your email lists. You may also use our API to resell our services.   # Authentication Use your API key to identify your account when making an API call. Each endpoint contains an example of how to use our API.  Simply just replace \"your-api-key\" with your API key you can find on this page: https://app.millionverifier.com/api  Test API key for development: \"API_KEY_FOR_TEST\". This API key will return random results.  # SSL Information The following versions (or above) are supported to make a succesful request in certain programming languages:   - PHP 5.4.45 <=   - Python (Requests module) 1.0.0 <=   - cURL 7.65.3 <=    - Java (OpenJDK) 10 <=   - NodeJS 0.10.28 <=   - C# (.NET Core) 2.1 <=  # Servers - Single API base URL: https://api.millionverifier.com  - Bulk API base URL: https://bulkapi.millionverifier.com "
# Override this license by providing a License Object in the OpenAPI.
license = "Unlicense"
edition = "2021"

[dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
url = "^2.5"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
