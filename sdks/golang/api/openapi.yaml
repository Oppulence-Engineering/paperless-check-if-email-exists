openapi: 3.0.0
info:
  contact:
    email: amaury@reacher.email
    name: Reacher
    url: https://reacher.email
  description: |-
    ### What is Reacher?

    Reacher provides email verification, list hygiene, suppressions, scheduled re-verification, and pipelines. The app and API use the same host.
  license:
    name: AGPL-3.0 OR Commercial
    url: https://github.com/reacherhq/check-if-email-exists/blob/master/LICENSE.md
  termsOfService: https://github.com/reacherhq/policies/blob/master/terms/index.fr.md
  title: Reacher
  version: 4.3.0
servers:
- description: Reacher Production
  url: /
security:
- Authorization: []
tags:
- description: System and service metadata endpoints
  name: System
- description: Service health endpoints
  name: Health
- description: Legacy v0 API endpoints
  name: v0
- description: Primary v1 API endpoints
  name: v1
- description: Job lifecycle and results endpoints
  name: Jobs
- description: Scheduled list-cleaning pipeline endpoints
  name: Pipelines
- description: Account-level endpoints
  name: Account
- description: Administrative endpoints
  name: Admin
- description: Administrative job endpoints
  name: Admin Jobs
- description: Tenant-scoped account settings and domain endpoints
  name: Tenant
- description: "List upload, cleaning, and quality endpoints"
  name: Lists
- description: Historical verification lookup endpoints
  name: Verification
- description: Advanced audit log endpoints
  name: Events
- description: Advanced historical query endpoints; experimental for large reporting
    workloads
  name: Query
- description: Collaboration annotation endpoints; experimental
  name: Comments
- description: "Normalized provider outcomes, suppression feedback, authenticated\
    \ provider adapters, and campaign outcome ingestion"
  name: Outcomes
paths:
  /healthz:
    get:
      description: Returns a lightweight readiness signal with no upstream dependency
        checks.
      operationId: healthz
      responses:
        "200":
          description: Service is alive
      security: []
      summary: GET /healthz
      tags:
      - Health
  /openapi.json:
    get:
      operationId: openapi_spec
      responses:
        "200":
          description: Merged OpenAPI specification for all documented REST endpoints
      security: []
      summary: Serve the merged OpenAPI document for all documented REST endpoints.
      tags:
      - System
  /readyz:
    get:
      description: Performs dependency checks for Postgres and RabbitMQ and returns
        readiness status.
      operationId: readyz
      responses:
        "200":
          description: Service readiness and dependency checks
      security: []
      summary: GET /readyz
      tags:
      - Health
  /v0/bulk:
    post:
      description: Creates a legacy bulk verification job and queues tasks synchronously
        via sqlxmq.
      operationId: create_bulk_job
      responses:
        "200":
          description: Legacy bulk job created
      security:
      - LegacySecret: []
      summary: POST /v0/bulk
      tags:
      - v0
  /v0/bulk/{job_id}:
    get:
      description: Returns current status and summary for a legacy bulk verification
        job.
      operationId: get_bulk_job_status
      parameters:
      - description: Legacy bulk job identifier
        explode: false
        in: path
        name: job_id
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      responses:
        "200":
          description: Bulk status response
      security:
      - LegacySecret: []
      summary: "GET /v0/bulk/{job_id}"
      tags:
      - v0
  /v0/bulk/{job_id}/results:
    get:
      description: Returns terminal result rows for a legacy bulk job.
      operationId: get_bulk_job_result
      parameters:
      - description: Legacy bulk job identifier
        explode: false
        in: path
        name: job_id
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      responses:
        "200":
          description: Bulk job results
      security:
      - LegacySecret: []
      summary: "GET /v0/bulk/{job_id}/results"
      tags:
      - v0
  /v0/check_email:
    post:
      description: "Legacy email verification endpoint (deprecated, retained for compatibility)."
      operationId: post_check_email
      parameters:
      - description: Optional idempotency key
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          nullable: true
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckEmailRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckEmailOutput"
          description: Email verification result
      security:
      - Authorization: []
      - LegacySecret: []
      summary: POST /v0/check_email
      tags:
      - v0
  /v1/admin/api-keys:
    get:
      description: List all API keys across tenants with optional filtering.
      operationId: list_all_api_keys
      parameters:
      - explode: true
        in: query
        name: tenant_id
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: status
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          type: integer
        style: form
      - explode: true
        in: query
        name: offset
        required: false
        schema:
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAllApiKeys"
          description: All API keys
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Request error
      security:
      - AdminSecret: []
      summary: GET /v1/admin/api-keys
      tags:
      - Admin
  /v1/admin/jobs:
    get:
      description: List jobs across all tenants with optional filters.
      operationId: list_jobs
      parameters:
      - explode: true
        in: query
        name: status
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: tenant_id
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          type: integer
        style: form
      - explode: true
        in: query
        name: offset
        required: false
        schema:
          type: integer
        style: form
      responses:
        "200":
          description: Admin job list
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Request error
      security:
      - AdminSecret: []
      summary: GET /v1/admin/jobs
      tags:
      - Admin Jobs
  /v1/admin/jobs/{job_id}:
    get:
      description: Fetch a single job.
      operationId: get_job
      parameters:
      - description: Job identifier
        explode: false
        in: path
        name: job_id
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      responses:
        "200":
          description: Admin job details
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Request error
      security:
      - AdminSecret: []
      summary: "GET /v1/admin/jobs/{job_id}"
      tags:
      - Admin Jobs
  /v1/admin/jobs/{job_id}/events:
    get:
      description: Fetch events for a job.
      operationId: get_job_events
      parameters:
      - description: Job identifier
        explode: false
        in: path
        name: job_id
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - explode: true
        in: query
        name: offset
        required: false
        schema:
          format: int64
          type: integer
        style: form
      responses:
        "200":
          description: Job event list
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Request error
      security:
      - AdminSecret: []
      summary: "GET /v1/admin/jobs/{job_id}/events"
      tags:
      - Admin Jobs
  /v1/admin/jobs/{job_id}/results:
    get:
      description: Fetch task results for a job.
      operationId: get_job_results
      parameters:
      - description: Job identifier
        explode: false
        in: path
        name: job_id
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - explode: true
        in: query
        name: offset
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - explode: true
        in: query
        name: state
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          description: Job result list
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Request error
      security:
      - AdminSecret: []
      summary: "GET /v1/admin/jobs/{job_id}/results"
      tags:
      - Admin Jobs
  /v1/admin/tenants:
    get:
      description: List tenants with optional status and pagination filters.
      operationId: list_tenants
      parameters:
      - explode: true
        in: query
        name: status
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          type: integer
        style: form
      - explode: true
        in: query
        name: offset
        required: false
        schema:
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTenantList"
          description: Tenant list
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Request error
      security:
      - AdminSecret: []
      summary: GET /v1/admin/tenants
      tags:
      - Admin
    post:
      description: Create a new tenant.
      operationId: create_tenant
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateTenantRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTenant"
          description: Tenant created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Request error
      security:
      - AdminSecret: []
      summary: POST /v1/admin/tenants
      tags:
      - Admin
  /v1/admin/tenants/{tenant_id}:
    delete:
      description: Delete a tenant.
      operationId: delete_tenant
      parameters:
      - description: Tenant identifier
        explode: false
        in: path
        name: tenant_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: Tenant deleted
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Request error
      security:
      - AdminSecret: []
      summary: "DELETE /v1/admin/tenants/{tenant_id}"
      tags:
      - Admin
    get:
      description: Fetch tenant details by tenant ID.
      operationId: get_tenant
      parameters:
      - description: Tenant identifier
        explode: false
        in: path
        name: tenant_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTenant"
          description: Tenant details
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Request error
      security:
      - AdminSecret: []
      summary: "GET /v1/admin/tenants/{tenant_id}"
      tags:
      - Admin
    put:
      description: Update tenant fields.
      operationId: update_tenant
      parameters:
      - description: Tenant identifier
        explode: false
        in: path
        name: tenant_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateTenantRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTenant"
          description: Tenant updated
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Request error
      security:
      - AdminSecret: []
      summary: "PUT /v1/admin/tenants/{tenant_id}"
      tags:
      - Admin
  /v1/admin/tenants/{tenant_id}/api-keys:
    get:
      description: List API keys for a tenant.
      operationId: list_api_keys
      parameters:
      - description: Tenant identifier
        explode: false
        in: path
        name: tenant_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminApiKeyList"
          description: Tenant API keys
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Request error
      security:
      - AdminSecret: []
      summary: "GET /v1/admin/tenants/{tenant_id}/api-keys"
      tags:
      - Admin
    post:
      description: Create a new API key for a tenant.
      operationId: create_api_key
      parameters:
      - description: Tenant identifier
        explode: false
        in: path
        name: tenant_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminApiKeyWriteRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCreatedApiKey"
          description: API key created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Request error
      security:
      - AdminSecret: []
      summary: "POST /v1/admin/tenants/{tenant_id}/api-keys"
      tags:
      - Admin
  /v1/admin/tenants/{tenant_id}/api-keys/{key_id}:
    delete:
      description: Revoke an API key.
      operationId: revoke_api_key
      parameters:
      - description: Tenant identifier
        explode: false
        in: path
        name: tenant_id
        required: true
        schema:
          type: string
        style: simple
      - description: API key identifier
        explode: false
        in: path
        name: key_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          description: API key revoked
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Request error
      security:
      - AdminSecret: []
      summary: "DELETE /v1/admin/tenants/{tenant_id}/api-keys/{key_id}"
      tags:
      - Admin
    get:
      description: Fetch one API key by tenant and key ID.
      operationId: get_api_key
      parameters:
      - description: Tenant identifier
        explode: false
        in: path
        name: tenant_id
        required: true
        schema:
          type: string
        style: simple
      - description: API key identifier
        explode: false
        in: path
        name: key_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminApiKey"
          description: API key details
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Request error
      security:
      - AdminSecret: []
      summary: "GET /v1/admin/tenants/{tenant_id}/api-keys/{key_id}"
      tags:
      - Admin
    patch:
      description: Update metadata for an API key.
      operationId: update_api_key
      parameters:
      - description: Tenant identifier
        explode: false
        in: path
        name: tenant_id
        required: true
        schema:
          type: string
        style: simple
      - description: API key identifier
        explode: false
        in: path
        name: key_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminApiKeyWriteRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminApiKey"
          description: API key updated
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Request error
      security:
      - AdminSecret: []
      summary: "PATCH /v1/admin/tenants/{tenant_id}/api-keys/{key_id}"
      tags:
      - Admin
  /v1/admin/tenants/{tenant_id}/api-keys/{key_id}/reactivate:
    post:
      description: Reactivate a previously revoked API key.
      operationId: reactivate_api_key
      parameters:
      - description: Tenant identifier
        explode: false
        in: path
        name: tenant_id
        required: true
        schema:
          type: string
        style: simple
      - description: API key identifier
        explode: false
        in: path
        name: key_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          description: API key reactivated
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Request error
      security:
      - AdminSecret: []
      summary: "POST /v1/admin/tenants/{tenant_id}/api-keys/{key_id}/reactivate"
      tags:
      - Admin
  /v1/admin/tenants/{tenant_id}/jobs:
    get:
      description: List jobs scoped to one tenant.
      operationId: list_tenant_jobs
      parameters:
      - description: Tenant identifier
        explode: false
        in: path
        name: tenant_id
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: status
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - explode: true
        in: query
        name: offset
        required: false
        schema:
          format: int64
          type: integer
        style: form
      responses:
        "200":
          description: Tenant job list
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Request error
      security:
      - AdminSecret: []
      summary: "GET /v1/admin/tenants/{tenant_id}/jobs"
      tags:
      - Admin Jobs
  /v1/admin/tenants/{tenant_id}/quota:
    get:
      description: Fetch current tenant quota usage and remaining allowance.
      operationId: get_tenant_quota
      parameters:
      - description: Tenant identifier
        explode: false
        in: path
        name: tenant_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTenantQuota"
          description: Tenant quota details
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Request error
      security:
      - AdminSecret: []
      summary: "GET /v1/admin/tenants/{tenant_id}/quota"
      tags:
      - Admin
    patch:
      description: Update tenant quota limit.
      operationId: update_tenant_quota
      parameters:
      - description: Tenant identifier
        explode: false
        in: path
        name: tenant_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateQuotaRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTenantQuota"
          description: Quota updated
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Request error
      security:
      - AdminSecret: []
      summary: "PATCH /v1/admin/tenants/{tenant_id}/quota"
      tags:
      - Admin
  /v1/admin/tenants/{tenant_id}/quota/reset:
    post:
      description: Reset tenant quota usage counters.
      operationId: reset_tenant_quota
      parameters:
      - description: Tenant identifier
        explode: false
        in: path
        name: tenant_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTenantQuota"
          description: Quota reset
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Request error
      security:
      - AdminSecret: []
      summary: "POST /v1/admin/tenants/{tenant_id}/quota/reset"
      tags:
      - Admin
  /v1/alerts:
    get:
      operationId: v1_list_alerts
      parameters:
      - explode: true
        in: query
        name: status
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: type
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - explode: true
        in: query
        name: offset
        required: false
        schema:
          format: int64
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertListResponse"
          description: Tenant alert inbox
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Request error
      summary: GET /v1/alerts
      tags:
      - Verification
  /v1/alerts/{alert_id}:
    patch:
      operationId: v1_update_alert
      parameters:
      - description: Alert identifier
        explode: false
        in: path
        name: alert_id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAlertRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertView"
          description: Updated alert
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Request error
      summary: "PATCH /v1/alerts/{alert_id}"
      tags:
      - Verification
  /v1/bulk:
    post:
      description: Creates a tenant-scoped bulk job for async processing.
      operationId: v1_create_bulk_job
      parameters:
      - description: Optional idempotency key
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          nullable: true
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkCreateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkCreateResponse"
          description: Bulk job created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Request error
      summary: Create the v1 bulk endpoint.
      tags:
      - v1
  /v1/bulk/{job_id}:
    get:
