{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "check-if-email-exists.fullname" . }}-egress
  labels:
    {{- include "check-if-email-exists.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "check-if-email-exists.selectorLabels" . | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- if .Values.config.env.RCH__RESEARCH__URL }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: leads-scraper-service
              app.kubernetes.io/instance: lead-scraper-service
              app.kubernetes.io/component: http
      ports:
        - {protocol: TCP, port: 8080}
    {{- end }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.88.99.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
        - ipBlock:
            cidr: 2000::/3
            except:
              - 2001::/23
              - 2001:db8::/32
              - 2002::/16
              - 3fff::/20
    {{- range .Values.networkPolicy.privateDestinations }}
    {{- if not (or (hasSuffix "/32" .cidr) (hasSuffix "/128" .cidr)) }}
    {{- fail "networkPolicy.privateDestinations requires individual /32 or /128 addresses" }}
    {{- end }}
    - to:
        - ipBlock:
            cidr: {{ .cidr | quote }}
      ports:
        {{- range required "Private destinations require explicit ports" .ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
