replicaCount: 1

image:
  repository: ghcr.io/oppulence-engineering/check-if-email-exists
  pullPolicy: Always
  tag: "latest"
  digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8080
  webPort: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

livenessProbe:
  httpGet:
    path: /healthz
    port: web
readinessProbe:
  httpGet:
    path: /readyz
    port: web
startupProbe:
  httpGet:
    path: /healthz
    port: web
  periodSeconds: 10
  failureThreshold: 30

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 95
  targetMemoryUtilizationPercentage: null

config:
  createConfigMap: true
  createSecret: true
  existingSecret: ""
  env:
    RUST_LOG: reacher=info
    SQLX_OFFLINE: "true"
    RCH__BACKEND_NAME: full-stack-kubernetes
    RCH__HTTP_HOST: 0.0.0.0
    RCH__HTTP_PORT: "8081"
    BACKEND_JWT_AUDIENCE: check-if-email-exists-api
    RCH__WORKER__ENABLE: "true"
    RCH__WORKER__THROTTLE__MAX_REQUESTS_PER_DAY: "8640000"
    RCH__WEBDRIVER_ADDR: http://localhost:9515
  secretEnv:
    DATABASE_URL: ""
    BETTER_AUTH_URL: ""
    BETTER_AUTH_SECRET: ""
    SCIM_CREDENTIAL_HASH_SECRET: ""
    RESEND_API_KEY: ""
    RESEND_FROM: ""
    RCH__STORAGE__POSTGRES__DB_URL: ""
    RCH__STORAGE__POSTGRES__READ_REPLICA_URL: ""
    RCH__WORKER__RABBITMQ__URL: ""
    RCH__PROXY__HOST: ""
    RCH__PROXY__PORT: ""
    RCH__PROXY__USERNAME: ""
    RCH__PROXY__PASSWORD: ""
    RCH__HEADER_SECRET: ""
    PLATFORM_ADMIN_EMAILS: ""
    RCH__SENTRY_DSN: ""

extraEnv: []

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
