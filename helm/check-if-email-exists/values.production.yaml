# Production overrides: the public web app at verifier.playbookmedia.io.
# cert-manager issues the certificate through the Cloudflare DNS-01 solver,
# so each of the three clusters gets a certificate for the same host.
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    # Better Auth session cookies are large; the default buffer returns 502.
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
  hosts:
    - host: verifier.playbookmedia.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - verifier.playbookmedia.io
      secretName: verifier-playbookmedia-io-tls

# The auth migration connects with Node. DigitalOcean signs every managed
# database in this account with the same CA, which the image includes.
config:
  env:
    RCH__VERIFICATION_BACKEND: millionverifier
    RCH__RESEARCH__URL: http://lead-scraper-service-leads-scraper-service:8080
    NODE_EXTRA_CA_CERTS: /srv/digitalocean-db-ca.pem
    # Leave room for rolling replacements on the shared 47-connection cluster.
    RCH__DB_MAX_CONNECTIONS: "2"
    DATABASE_POOL_MAX: "1"

# The Resend key comes from Infisical (/frontend/apps/sim, prod). The Infisical
# operator syncs it into this secret in each cluster. An env entry overrides the
# key of the same name in the app secret.
# ponytail: shares the Outbound Console key; give Verifier its own Infisical path if it needs its own Resend account.
extraEnv:
  - name: RCH__RESEARCH__BOOTSTRAP_API_KEY
    valueFrom:
      secretKeyRef:
        name: lead-scraper-gateway-api-key
        key: LEAD_SCRAPER_GATEWAY_API_KEY
  - name: RCH__MILLIONVERIFIER__API_KEY
    valueFrom:
      secretKeyRef:
        name: paperless-sim-app-secrets
        key: RCH__MILLIONVERIFIER__API_KEY
  - name: RESEND_API_KEY
    valueFrom:
      secretKeyRef:
        name: paperless-sim-app-secrets
        key: RESEND_API_KEY
