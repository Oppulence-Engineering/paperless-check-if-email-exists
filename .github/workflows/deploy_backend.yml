name: deploy_full_stack

on:
  push:
    branches:
      - develop
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production
          - all
        default: staging

# Publish the web, API, and worker as one image.
permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image_tag.outputs.value }}
    env:
      IMAGE_NAME: ghcr.io/oppulence-engineering/check-if-email-exists
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=raw,value=sha-${{ github.sha }}

      - name: Build smoke image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: check-if-email-exists-smoke:${{ github.sha }}
          cache-from: type=gha

      - name: Smoke full stack image
        run: ./ci/smoke_full_stack_image.bash check-if-email-exists-smoke:${{ github.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Capture image tag
        id: image_tag
        run: echo "value=sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

  deploy-production:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.environment == 'production' || github.event.inputs.environment == 'all')) }}
    name: "Production – ${{ matrix.cluster }}"
    needs: docker
    strategy:
      fail-fast: false
      matrix:
        cluster: [us-east, eu-central, us-west]
    uses: ./.github/workflows/deploy-helm-direct-template.yml
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      cluster: ${{ matrix.cluster }}
      service_name: check-if-email-exists
      service_path: .
      chart_repository: ./helm/check-if-email-exists
      namespace: paperless-production
      create_namespace: true
      image_repository: ghcr.io/oppulence-engineering/check-if-email-exists
      image_tag: ${{ needs.docker.outputs.image_tag }}
      secret_env_overrides: |
        RCH__STORAGE__POSTGRES__DB_URL=$HELM_POSTGRES_URL
        DATABASE_URL=$HELM_POSTGRES_URL
        RCH__STORAGE__POSTGRES__READ_REPLICA_URL=$HELM_READ_REPLICA_URL
        RCH__WORKER__RABBITMQ__URL=$HELM_RABBIT_URL
        BETTER_AUTH_URL=$BETTER_AUTH_URL
        BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET
        SCIM_CREDENTIAL_HASH_SECRET=$SCIM_CREDENTIAL_HASH_SECRET
        RESEND_API_KEY=$RESEND_API_KEY
        RESEND_FROM=$RESEND_FROM
        RCH__PROXY__HOST=$RCH__PROXY__HOST
        RCH__PROXY__PORT=$RCH__PROXY__PORT
        RCH__PROXY__USERNAME=$RCH__PROXY__USERNAME
        RCH__PROXY__PASSWORD=$RCH__PROXY__PASSWORD
        RCH__HEADER_SECRET=$RCH__HEADER_SECRET
        RCH__SENTRY_DSN=$HELM_SENTRY_DSN
    secrets: inherit

  deploy-staging:
    if: ${{ github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.environment == 'staging' || github.event.inputs.environment == 'all')) }}
    name: "Staging – ${{ matrix.cluster }}"
    needs: docker
    strategy:
      fail-fast: false
      matrix:
        cluster: [us-east, eu-central, us-west]
    uses: ./.github/workflows/deploy-helm-direct-template.yml
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      cluster: ${{ matrix.cluster }}
      service_name: check-if-email-exists-staging
      service_path: .
      chart_repository: ./helm/check-if-email-exists
      values_file: ./helm/check-if-email-exists/values.staging.yaml
      namespace: paperless-staging
      create_namespace: true
      image_repository: ghcr.io/oppulence-engineering/check-if-email-exists
      image_tag: ${{ needs.docker.outputs.image_tag }}
      secret_env_overrides: |
        RCH__STORAGE__POSTGRES__DB_URL=$HELM_POSTGRES_URL_STAGING
        DATABASE_URL=$HELM_POSTGRES_URL_STAGING
        RCH__STORAGE__POSTGRES__READ_REPLICA_URL=$HELM_READ_REPLICA_URL
        RCH__WORKER__RABBITMQ__URL=$HELM_RABBIT_URL
        BETTER_AUTH_URL=$BETTER_AUTH_URL_STAGING
        BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET_STAGING
        SCIM_CREDENTIAL_HASH_SECRET=$SCIM_CREDENTIAL_HASH_SECRET_STAGING
        RESEND_API_KEY=$RESEND_API_KEY_STAGING
        RESEND_FROM=$RESEND_FROM_STAGING
        RCH__PROXY__HOST=$RCH__PROXY__HOST
        RCH__PROXY__PORT=$RCH__PROXY__PORT
        RCH__PROXY__USERNAME=$RCH__PROXY__USERNAME
        RCH__PROXY__PASSWORD=$RCH__PROXY__PASSWORD
        RCH__HEADER_SECRET=$RCH__HEADER_SECRET
        RCH__SENTRY_DSN=$HELM_SENTRY_DSN
    secrets: inherit
