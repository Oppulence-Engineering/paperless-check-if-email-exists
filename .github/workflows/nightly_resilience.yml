name: nightly_resilience

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

env:
  SQLX_OFFLINE: true

jobs:
  resilience:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install stable toolchain
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Run failure-injection suite
        uses: actions-rs/cargo@844f36862e911db73fe0815f00a4a2602c279505 # v1
        with:
          command: test
          args: -p reacher_backend --test e2e_failure_injection -- --nocapture

      - name: Run concurrency suite
        uses: actions-rs/cargo@844f36862e911db73fe0815f00a4a2602c279505 # v1
        with:
          command: test
          args: -p reacher_backend --test e2e_concurrency -- --nocapture
