name: sdk-generate

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag on main (e.g., v4.6.0)'
        type: string
        required: true

env:
  OPENAPI_GENERATOR_VERSION: '7.14.0'
  NODE_VERSION: '20'
  GO_VERSION: '1.21'

permissions:
  contents: read

jobs:
  validate-release:
    uses: ./.github/workflows/validate-release-ref.yml
    with:
      tag: ${{ github.event.release.tag_name || inputs.version }}

  # Generate TypeScript SDK
  generate-typescript:
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-release.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Install OpenAPI Generator
        run: |
          npm install -g @openapitools/openapi-generator-cli
          openapi-generator-cli version-manager set ${{ env.OPENAPI_GENERATOR_VERSION }}

      - name: Generate TypeScript SDK
        run: |
          openapi-generator-cli generate \
            -i backend/openapi.json \
            -g typescript-axios \
            -o sdks/typescript/src \
            --additional-properties=npmName=@oppulence/reacher-sdk,supportsES6=true,withInterfaces=true,withSeparateModelsAndApi=true,apiPackage=api,modelPackage=models,useSingleRequestParameter=true

      - name: Install dependencies and build
        working-directory: sdks/typescript
        run: |
          npm install
          npm run build

      - name: Run tests
        working-directory: sdks/typescript
        run: npm test

      - name: Upload TypeScript SDK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: typescript-sdk
          path: sdks/typescript/

  # Generate Go SDK
  generate-golang:
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-release.outputs.sha }}

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node.js (for openapi-generator)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install OpenAPI Generator
        run: |
          npm install -g @openapitools/openapi-generator-cli
          openapi-generator-cli version-manager set ${{ env.OPENAPI_GENERATOR_VERSION }}

      - name: Generate Go SDK
        run: |
          openapi-generator-cli generate \
            -i backend/openapi.json \
            -g go \
            -o sdks/golang \
            --additional-properties=packageName=reacher,isGoSubmodule=true,generateInterfaces=true,structPrefix=true,enumClassPrefix=true
          rm -rf sdks/golang/test

      - name: Tidy Go modules
        working-directory: sdks/golang
        run: |
          go mod edit -module=github.com/Oppulence-Engineering/check-if-email-exists/sdks/golang/v4
          go mod tidy
          test "$(go list -m)" = "github.com/Oppulence-Engineering/check-if-email-exists/sdks/golang/v4"

      - name: Run Go tests
        working-directory: sdks/golang
        run: go test ./...

      - name: Upload Go SDK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: golang-sdk
          path: sdks/golang/

  # Publish TypeScript SDK to npm (uses unified release version)
  publish-typescript:
    runs-on: ubuntu-latest
    needs: [validate-release, generate-typescript, generate-golang]
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-release.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Get unified release version
        id: version
        env:
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
        run: echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update SDK version to match release
        working-directory: sdks/typescript
        run: |
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Install and build
        working-directory: sdks/typescript
        run: |
          npm install
          npm run build

      # npm 11.5.1 or later publishes through npm trusted publishing (OIDC),
      # so no long-lived token is needed. NPM_TOKEN stays as a fallback.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@11.6.2

      - name: Publish to npm
        working-directory: sdks/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

  # Tag Go SDK for pkg.go.dev (uses unified release version)
  tag-golang:
    runs-on: ubuntu-latest
    needs: [validate-release, generate-typescript, generate-golang]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-release.outputs.sha }}

      - name: Get unified release version
        id: version
        env:
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
        run: echo "version=v$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Go module tag
        env:
          MODULE_TAG: sdks/golang/${{ steps.version.outputs.version }}
          RELEASE_SHA: ${{ needs.validate-release.outputs.sha }}
        run: |
          set -euo pipefail
          if existing_sha=$(git rev-parse --verify "refs/tags/$MODULE_TAG^{commit}" 2>/dev/null); then
            [[ "$existing_sha" == "$RELEASE_SHA" ]] || { echo 'Module tag points to another commit'; exit 1; }
          else
            git tag "$MODULE_TAG" "$RELEASE_SHA"
          fi
          git push origin "refs/tags/$MODULE_TAG"
