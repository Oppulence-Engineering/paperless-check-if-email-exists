name: pr

on:
  pull_request:
  push:
    branches:
      - master

# For backend, run builds and tests without sqlx's compile time query checks
# https://github.com/launchbadge/sqlx/blob/master/sqlx-cli/README.md#force-building-in-offline-mode
env:
  SQLX_OFFLINE: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the local TypeScript SDK
        run: |
          npm install --prefix sdks/typescript/src --no-package-lock --ignore-scripts
          npm run build --prefix sdks/typescript/src
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Verify web contracts, lint, and types
        run: pnpm verify:fast
        working-directory: web
      - name: Check web architecture and generated API
        run: |
          pnpm arch
          pnpm contracts:check
          pnpm queries:check
          pnpm knip
        working-directory: web
      - name: Run web tests
        run: pnpm test
        working-directory: web
      - name: Build web runtime
        run: pnpm build
        working-directory: web

  web-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Run security scanners
        run: |
          pnpm security:semgrep
          pnpm security:gitleaks
          pnpm security:osv
        working-directory: web

  # Cargo check.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        run: rustup update stable && rustup default stable

      - name: Run cargo check
        run: cargo check --all

  # Explicit full HTTP API harness gate.
  api-harness:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reacher_test
        ports:
          - 25432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3.8.22-management
        ports:
          - 35672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics check_running"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:25432/reacher_test
      TEST_AMQP_URL: amqp://guest:guest@127.0.0.1:35672
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        run: rustup update stable && rustup default stable

      - name: Run full HTTP API harness
        run: cargo test -p reacher_backend --test e2e_api_harness -- --nocapture

  migration-upgrade:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reacher_test
        ports:
          - 25432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3.8.22-management
        ports:
          - 35672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics check_running"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:25432/reacher_test
      TEST_AMQP_URL: amqp://guest:guest@127.0.0.1:35672
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        run: rustup update stable && rustup default stable

      - name: Run migration upgrade harness
        run: cargo test -p reacher_backend --test e2e_migration_upgrade -- --nocapture

  # Cargo test.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reacher_test
        ports:
          - 25432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3.8.22-management
        ports:
          - 35672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics check_running"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:25432/reacher_test
      TEST_AMQP_URL: amqp://guest:guest@127.0.0.1:35672
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        run: rustup update stable && rustup default stable

      - name: Run cargo test
        run: cargo test --all

  # Cargo fmt and clippy
  lints:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy --all -- -A deprecated
